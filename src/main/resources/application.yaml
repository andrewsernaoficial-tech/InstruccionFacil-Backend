spring:
  application:
    name: instruccionfacil-backend
  profiles:
    default: local
    group:
      docker: oracle
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  jwt-secret: ${APP_JWT_SECRET:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  admin-reset-password: ${APP_ADMIN_RESET_PASSWORD:false}
  reservation-minutes: ${APP_RESERVATION_MINUTES:30}
  pago-yape: ${APP_PAGO_YAPE:}
  pago-plin: ${APP_PAGO_PLIN:}
  pago-transferencia: ${APP_PAGO_TRANSFERENCIA:}
  mp-api-url: ${APP_MP_API_URL:https://api.mercadopago.com}
  mp-token: ${APP_MP_TOKEN:}
  mp-webhook-secret: ${APP_MP_WEBHOOK_SECRET:}
  mp-frontend-url: ${APP_MP_FRONTEND_URL:}
  gmail-oauth-url: ${APP_GMAIL_OAUTH_URL:https://oauth2.googleapis.com/token}
  gmail-api-url: ${APP_GMAIL_API_URL:https://gmail.googleapis.com}
  gmail-client-id: ${APP_GMAIL_CLIENT_ID:}
  gmail-client-secret: ${APP_GMAIL_CLIENT_SECRET:}
  gmail-refresh-token: ${APP_GMAIL_REFRESH_TOKEN:}
  gmail-remitente: ${APP_GMAIL_REMITENTE:}
  dni-api-url: ${APP_DNI_API_URL:https://api.endpoint.pe}
  dni-token: ${APP_DNI_TOKEN:}
  dni-obligatorio: ${APP_DNI_OBLIGATORIO:false}
